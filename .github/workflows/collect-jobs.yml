name: Collect Jobs

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-production-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            job-collector/requirements.txt

      - name: Verify database secret is configured
        run: test -n "$DATABASE_URL"

      - name: Install collector dependencies
        run: python -m pip install -r backend/requirements.txt -r job-collector/requirements.txt

      - name: Collect and persist jobs
        run: python job-collector/main.py