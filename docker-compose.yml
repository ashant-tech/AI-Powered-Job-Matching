services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch
      POSTGRES_DB: jobmatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatch"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://jobmatch:jobmatch@db:5432/jobmatch
      SECRET_KEY: ${SECRET_KEY:-change-me}
      UPLOAD_DIR: /app/uploads/cvs
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  job-collector:
    build: ./job-collector
    environment:
      API_URL: http://backend:8000
      API_TOKEN: ${API_TOKEN:-}
    depends_on:
      - backend

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
